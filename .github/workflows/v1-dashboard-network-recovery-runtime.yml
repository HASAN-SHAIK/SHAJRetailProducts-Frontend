name: V1 Dashboard Network Recovery Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-network-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source head
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          echo "V1_DASHBOARD_NETWORK_EXPECTED_HEAD=$EXPECTED"
          echo "V1_DASHBOARD_NETWORK_ACTUAL_HEAD=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Focused dashboard network acceptance
        run: CI=true npm test -- --watchAll=false --runTestsByPath src/pages/dashboardNetworkState.v1.test.js

      - name: Relevant frontend suite
        id: suite
        continue-on-error: true
        run: CI=true npm test -- --watchAll=false

      - name: CI-mode production build gate
        id: ci_build
        continue-on-error: true
        env:
          REACT_APP_POS_LOCAL_API_ENABLED: 'true'
          REACT_APP_POS_LOCAL_API_URL: http://127.0.0.1:4782/api/v1
        run: CI=true npm run build

      - name: Build runnable production bundle
        env:
          REACT_APP_POS_LOCAL_API_ENABLED: 'true'
          REACT_APP_POS_LOCAL_API_URL: http://127.0.0.1:4782/api/v1
        run: CI=false npm run build

      - name: Start runnable production frontend
        run: |
          npx --yes serve@14 -s build -l 4178 > /tmp/v1-network-server.log 2>&1 &
          echo $! > /tmp/v1-network-server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4178/dashboard >/tmp/v1-network.html; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4178/dashboard >/tmp/v1-network.html
          echo "V1_DASHBOARD_HTTP_STATUS=200"

      - name: Real browser virtual network-loss recovery
        id: runtime
        continue-on-error: true
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:4178
        run: npx cypress run --browser electron --spec cypress/e2e/runtime/v1-dashboard-network-recovery.cy.js

      - name: Post-runtime application health
        id: health
        if: always()
        run: |
          PID="$(cat /tmp/v1-network-server.pid)"
          kill -0 "$PID"
          STATUS="$(curl -sS -o /tmp/v1-network-after.html -w '%{http_code}' http://127.0.0.1:4178/dashboard)"
          echo "V1_DASHBOARD_POST_RUNTIME_HTTP_STATUS=$STATUS"
          test "$STATUS" = "200"

      - name: Evidence
        if: always()
        run: |
          echo "V1_DASHBOARD_NETWORK_HEAD=$(git rev-parse HEAD)"
          echo "V1_DASHBOARD_NETWORK_SUITE_OUTCOME=${{ steps.suite.outcome }}"
          echo "V1_DASHBOARD_NETWORK_CI_BUILD_OUTCOME=${{ steps.ci_build.outcome }}"
          echo "V1_DASHBOARD_NETWORK_RUNTIME_OUTCOME=${{ steps.runtime.outcome }}"
          echo "V1_DASHBOARD_NETWORK_HEALTH_OUTCOME=${{ steps.health.outcome }}"
          echo "V1_NETWORK_LOSS_VIRTUAL_SIMULATION=true"
          echo "V1_PHYSICAL_NETWORK_LOSS_ACCEPTANCE=NOT_YET_VERIFIED"
          cat /tmp/v1-network-server.log || true

      - name: Enforce target runtime result
        if: always()
        run: |
          test "${{ steps.runtime.outcome }}" = "success"
          test "${{ steps.health.outcome }}" = "success"

      - name: Enforce complete certification result
        if: always()
        run: |
          test "${{ steps.suite.outcome }}" = "success"
          test "${{ steps.ci_build.outcome }}" = "success"
