name: Apply V1 cashier transaction sync status wiring

on:
  push:
    branches:
      - v1/cashier-transaction-sync-status

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/cashier-transaction-sync-status
          fetch-depth: 0
      - name: Apply exact Orders drawer wiring
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/OrdersPage/OrdersPage.js')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { isLocalPosEnabled } from '../../Repositories/local/posLocalApiClient';\n"
          import_replacement = import_anchor + "import TransactionSyncStatus from './TransactionSyncStatus';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit(f'expected exactly one local POS import anchor, found {text.count(import_anchor)}')
          if "import TransactionSyncStatus from './TransactionSyncStatus';" not in text:
              text = text.replace(import_anchor, import_replacement, 1)

          drawer_anchor = '''                <section className="drawer-section summary">\n                  <h4>Payment Summary</h4>'''
          drawer_replacement = '''                <TransactionSyncStatus\n                  orderId={drawerOrder.id}\n                  enabled={isLocalPosEnabled()}\n                />\n\n''' + drawer_anchor
          if text.count(drawer_anchor) != 1:
              raise SystemExit(f'expected exactly one payment summary drawer anchor, found {text.count(drawer_anchor)}')
          if '<TransactionSyncStatus\n                  orderId={drawerOrder.id}' not in text:
              text = text.replace(drawer_anchor, drawer_replacement, 1)

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/apply-v1-cashier-status-wiring.yml')
          workflow.unlink()
      - name: Verify patch scope
        run: |
          git diff --check
          git diff -- src/components/OrdersPage/OrdersPage.js
          test "$(git diff --name-only | sort)" = "src/components/OrdersPage/OrdersPage.js"
      - name: Commit surgical wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show transaction sync status in Orders drawer"
          git push origin HEAD:v1/cashier-transaction-sync-status
