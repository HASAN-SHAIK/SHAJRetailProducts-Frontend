name: Apply V1 Sync Center authority containment

on:
  push:
    branches:
      - v1/frontend-sync-center-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/frontend-sync-center-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused authority patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/SyncCenter.jsx')
          source = path.read_text()

          replacements = [
              (
                  "  const { showPopup } = usePopup();\n  const userDetails = useSelector((state) => state.user.userDetails);",
                  "  const { showPopup } = usePopup();\n  const localPosAuthoritative = isLocalPosEnabled();\n  const userDetails = useSelector((state) => state.user.userDetails);",
              ),
              (
                  "  const handleRunSingle = async (module) => {\n    if (syncingAll || runningModule) return;",
                  "  const handleRunSingle = async (module) => {\n    if (localPosAuthoritative) {\n      showPopup('POSService/SQLite owns synchronization in local POS mode. Use the POS diagnostics above for sync state.', 'Sync Center');\n      return;\n    }\n    if (syncingAll || runningModule) return;",
              ),
              (
                  "  const handleRetryAll = async () => {\n    if (syncingAll || runningModule) return;",
                  "  const handleRetryAll = async () => {\n    if (localPosAuthoritative) {\n      showPopup('POSService/SQLite owns synchronization in local POS mode. Browser retry controls are disabled.', 'Sync Center');\n      return;\n    }\n    if (syncingAll || runningModule) return;",
              ),
              (
                  "  const handleForceFullSync = async () => {\n    if (forceFullSyncing || syncingAll || runningModule) return;",
                  "  const handleForceFullSync = async () => {\n    if (localPosAuthoritative) {\n      showPopup('POSService/SQLite owns synchronization in local POS mode. Browser full-sync is disabled.', 'Sync Center');\n      return;\n    }\n    if (forceFullSyncing || syncingAll || runningModule) return;",
              ),
              (
                  "  const handleRetryImport = async (importId) => {\n    if (!importId) return;",
                  "  const handleRetryImport = async (importId) => {\n    if (!importId) return;\n    if (localPosAuthoritative) {\n      showPopup('POSService/SQLite owns synchronization in local POS mode. Browser import retry is disabled.', 'Sync Center');\n      return;\n    }",
              ),
              (
                  "          <small className=\"text-secondary\">Track pending records and trigger retries.</small>",
                  "          <small className=\"text-secondary\">\n            {localPosAuthoritative\n              ? 'POSService/SQLite is the synchronization authority. Browser retry/full-sync controls are disabled.'\n              : 'Track pending browser records and trigger legacy retries.'}\n          </small>",
              ),
              (
                  "            disabled={loading || refreshing || syncingAll || Boolean(runningModule)}\n          >\n            {syncingAll ? 'Retrying...' : 'Retry All'}",
                  "            disabled={localPosAuthoritative || loading || refreshing || syncingAll || Boolean(runningModule)}\n          >\n            {syncingAll ? 'Retrying...' : 'Retry All'}",
              ),
              (
                  "            disabled={loading || refreshing || syncingAll || Boolean(runningModule) || forceFullSyncing}\n          >\n            {forceFullSyncing ? 'Full Syncing...' : 'Force Full Sync'}",
                  "            disabled={localPosAuthoritative || loading || refreshing || syncingAll || Boolean(runningModule) || forceFullSyncing}\n          >\n            {forceFullSyncing ? 'Full Syncing...' : 'Force Full Sync'}",
              ),
              (
                  "                disabled={loading || refreshing || syncingAll || Boolean(runningModule)}\n              >\n                {isRunning ? 'Running...' : 'Retry'}",
                  "                disabled={localPosAuthoritative || loading || refreshing || syncingAll || Boolean(runningModule)}\n              >\n                {isRunning ? 'Running...' : 'Retry'}",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement target, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)

          test = Path('src/pages/SyncCenter.v1.test.js')
          test.write_text("""const fs = require('fs');
const path = require('path');

const source = fs.readFileSync(path.join(__dirname, 'SyncCenter.jsx'), 'utf8');

describe('V1 Sync Center local POS authority', () => {
  test('local POS mode disables legacy browser sync mutation controls', () => {
    expect(source).toContain('const localPosAuthoritative = isLocalPosEnabled();');
    expect(source).toContain("Browser retry controls are disabled.");
    expect(source).toContain("Browser full-sync is disabled.");
    expect(source).toContain("Browser import retry is disabled.");
    expect(source).toContain('disabled={localPosAuthoritative || loading || refreshing || syncingAll || Boolean(runningModule)}');
    expect(source).toContain('disabled={localPosAuthoritative || loading || refreshing || syncingAll || Boolean(runningModule) || forceFullSyncing}');
  });

  test('POSService diagnostics remain the local POS sync presentation', () => {
    expect(source).toContain("localPosRequest('/diagnostics')");
    expect(source).toContain("localPosRequest('/diagnostics/sync-events?limit=100')");
    expect(source).toContain('POSService/SQLite is the synchronization authority.');
  });
});
""")

          workflow = Path('.github/workflows/v1-frontend-completion.yml')
          wf = workflow.read_text()
          wf = wf.replace("      - 'src/utils/appSyncOrchestrator.v1.test.js'\n", "      - 'src/utils/appSyncOrchestrator.v1.test.js'\n      - 'src/pages/SyncCenter.jsx'\n      - 'src/pages/SyncCenter.v1.test.js'\n")
          wf = wf.replace("          src/utils/appSyncOrchestrator.v1.test.js\n", "          src/utils/appSyncOrchestrator.v1.test.js\n          src/pages/SyncCenter.v1.test.js\n")
          workflow.write_text(wf)

          Path('.github/workflows/v1-sync-center-authority-patch.yml').unlink()
      - name: Commit focused patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Contain V1 Sync Center browser sync controls"
          git push origin HEAD:v1/frontend-sync-center-authority
