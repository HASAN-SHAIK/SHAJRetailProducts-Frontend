name: V1 Cycle C Branch Devices Non-Admin Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Existing focused BranchDevices acceptance
        id: focused
        continue-on-error: true
        run: CI=true npm test -- --watchAll=false --runTestsByPath src/pages/BranchDevices.v1Acceptance.test.js
      - name: Relevant full frontend suite
        id: suite
        continue-on-error: true
        run: CI=true npm test -- --watchAll=false
      - name: Production build gate
        id: build
        continue-on-error: true
        run: CI=true npm run build
      - name: Start runnable frontend
        id: server
        run: |
          CI=false BROWSER=none PORT=4182 npm start > /tmp/cycle-c-branch-devices-server.log 2>&1 &
          echo $! > /tmp/cycle-c-branch-devices-server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4182/branch-devices >/tmp/cycle-c-branch-devices.html; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4182/branch-devices >/tmp/cycle-c-branch-devices.html
          echo "CYCLE_C_BRANCH_DEVICES_APP_HTTP=200"
      - name: Real browser non-admin authority path
        id: runtime
        continue-on-error: true
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:4182
        run: npx cypress run --browser electron --spec cypress/e2e/runtime/branch-devices-nonadmin.cy.js
      - name: Post-runtime process health
        id: health
        if: always()
        continue-on-error: true
        run: |
          curl -fsS http://127.0.0.1:4182/branch-devices >/dev/null
          test -s /tmp/cycle-c-branch-devices-server.pid
          kill -0 "$(cat /tmp/cycle-c-branch-devices-server.pid)"
          echo "CYCLE_C_BRANCH_DEVICES_POST_RUNTIME_HTTP=200"
          echo "CYCLE_C_BRANCH_DEVICES_PROCESS_ALIVE=true"
      - name: Certification evidence
        if: always()
        run: |
          echo "FOCUSED_OUTCOME=${{ steps.focused.outcome }}"
          echo "SUITE_OUTCOME=${{ steps.suite.outcome }}"
          echo "BUILD_OUTCOME=${{ steps.build.outcome }}"
          echo "SERVER_OUTCOME=${{ steps.server.outcome }}"
          echo "RUNTIME_OUTCOME=${{ steps.runtime.outcome }}"
          echo "HEALTH_OUTCOME=${{ steps.health.outcome }}"
          cat /tmp/cycle-c-branch-devices-server.log || true
          if [ "${{ steps.focused.outcome }}" != "success" ] || [ "${{ steps.runtime.outcome }}" != "success" ]; then exit 1; fi
          if [ "${{ steps.suite.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ] || [ "${{ steps.server.outcome }}" != "success" ] || [ "${{ steps.health.outcome }}" != "success" ]; then exit 2; fi
