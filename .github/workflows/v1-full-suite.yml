name: V1 Frontend full suite

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v1-full-suite.yml'
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    env:
      REACT_APP_POS_LOCAL_API_ENABLED: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Complete Frontend Jest suite
        run: npm test -- --watchAll=false
      - name: Production build
        env:
          CI: 'false'
        run: npm run build
